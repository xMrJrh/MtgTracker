name: Daily MTG Price Scanner

on:
  schedule:
    # '*/10 * * * *' signifie : Chaque heure, à la 10ème minute (ex: 11h10, 12h10...)
    # Changez par '0 11 * * *' si tu veux exactement à 11h00 UTC tous les jours
    - cron: '*/10 * * * *' 
  # Tu peux décommenter la ligne ci-dessous pour tester instantanément :
  # workflow_dispatch:

jobs:
  scan-prices:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Price Tracker Robot 🤖
        env:
          STREAMLIT_CREDENTIALS: ${{ secrets.STREAMLIT_CREDENTIALS }}
        run: |
          python auto_scan.py